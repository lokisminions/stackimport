name: CodeQL

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: "37 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Configure
        run: >
          cmake
          -S .
          -B build-codeql
          -DCMAKE_BUILD_TYPE=Debug
          -DSTACKIMPORT_BUILD_VENDOR_TOOLS=OFF
          -DSTACKIMPORT_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build-codeql --target stackimport-tests --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: "/language:c-cpp"
