name: Secret Scan

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: "53 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_TARBALL="/tmp/gitleaks.tar.gz"
          curl -fsSL -o "${GITLEAKS_TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected="$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt | awk '{print $1}')"
          actual="$(sha256sum "${GITLEAKS_TARBALL}" | awk '{print $1}')"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::gitleaks checksum mismatch: expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${GITLEAKS_TARBALL}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose
